bundle_id: lidaxiao-investment-strategy-skill-v3
book:
  title: 李大霄投资战略（第三版）
  author: 李大霄
  publisher: 经济日报出版社 2025 年 1 月第 3 版
  slug: 李大霄投资战略
entry:
  name: lidaxiao-investment-strategy-skill
  description: |
    《李大霄投资战略（第三版）》全书能力入口。当用户需要判断 A 股大势位置（是否历史大底/大顶）、
    跟踪国家队与聪明钱动向、做股债配置比较、评估自己是否适合入市、决定选股与排除方向、
    或用情绪逆向指标校准判断时使用。触发词：历史大底、地球顶、风向标、股债差、
    余钱、抓大放小、舆论一边倒、引资速度、抄底、逃顶、割肉、止损。仅覆盖书中方法论；不预测具体点位、不推荐个股、
    不构成投资建议。
  core_principles:
    - 底部需勇气、顶部需淡泊、中间需坚持；操作姿态由市场位置决定，而非情绪
    - 只用余钱（30—50 年不用且能承受净值波动），远离杠杆，普通人按基金五步骤逐级毕业
    - 投资赚上市公司创造的钱，投机只是转移交易对手的钱；多坐轿子、不坐庄、少交易
    - 大底与大顶靠多维公开信号交叉验证（估值/股债差/风向标/情绪/供给政策），不猜点位
    - 引资速度≥融资速度市场才涨；一二级市场平衡是 A 股问题的根源变量
    - 以后的牛市仅仅是好股票的牛市：只拥抱最低估最优质高股息核心资产，远离高估五类
    - 预测会受多种因素影响而偏差，本书内容仅为个人观点，绝不能作为操作依据（作者边界条款）
  out_of_scope:
    - 预测具体点位或日期
    - 推荐具体个股或代客决策
    - A 股/港股之外市场的方法论套用（书中美股内容仅作顶部信号参照）
    - 与本书方法论无关的泛财经问题
    - 原书后记内容（本批扫描件未含）
  stop_conditions:
    - 用户寻求具体买卖指令或点位目标时，声明边界并停止
    - 关键数据（估值/股息率/国债收益率/流量）缺失且用户无法提供时，按卡片判停规则输出"不可判定"而不是猜值
    - 情绪类或经验类单一信号不足以得出结论时，必须与其他维度交叉或明示降级
promotion_budget: 8
router_entry:
  name: lidaxiao-investment-strategy-skill-router
  description: 来源路由入口（compact pack 视图），意图路由表与 single 入口一致。
