    intents: [判断现在是该抄底、逃顶还是持有, 我被套了要不要止损认错, 我该防踏空还是防套牢, 这个点位该怎么摆操作姿态]
    keywords: [底部勇气, 顶部淡泊, 3000点坚持, 第一时间认错, 止损, 割肉, 被套, 套牢, 清仓, 拿不住, 恐惧踏空, 恐惧套牢]
    one_liner: 按市场位置匹配三阶段操作姿态——历史大底需勇气买入、中间区域需坚持持有、历史大顶需淡泊退出，并以"第一时间认错止损"兜底。
